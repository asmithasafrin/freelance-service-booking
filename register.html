{% extends "base.html" %}{% block content %}<div class="formbox"><h2>Create Account</h2><form method="post"><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="Email" required><input type="password" name="password" placeholder="Password" required><select name="role"><option value="customer">Customer</option><option value="freelancer">Freelancer</option></select><input name="skill" placeholder="Skill (for freelancer)"><input name="rate" type="number" placeholder="Rate"><textarea name="bio" placeholder="Short bio"></textarea><button class="btn">Register</button></form></div>{% endblock %}
